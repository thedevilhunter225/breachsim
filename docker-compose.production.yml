name: breachsim

x-backend-environment: &backend-environment
  ENVIRONMENT: production
  DATABASE_URL: postgresql+psycopg://breachsim:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/breachsim
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379/0
  SECRET_KEY: ${BACKEND_SECRET_KEY:?set BACKEND_SECRET_KEY}
  ENCRYPTION_KEY: ${BACKEND_ENCRYPTION_KEY:?set BACKEND_ENCRYPTION_KEY}
  FRONTEND_BASE_URL: https://${DOMAIN:?set DOMAIN}
  CORS_ORIGINS: '["https://${DOMAIN}"]'
  TRUSTED_HOSTS: '["${DOMAIN}","backend","localhost","127.0.0.1"]'
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  API_DOCS_ENABLED: "false"
  LOG_JSON: "true"
  SEED_DEMO_CONTENT: "false"
  MEDIA_STORAGE_DIR: /data/media
  REPORT_EXPORT_DIR: /data/reports
  BOOTSTRAP_ORG_NAME: ${BOOTSTRAP_ORG_NAME:-BreachSim Organization}
  BOOTSTRAP_ORG_SLUG: ${BOOTSTRAP_ORG_SLUG:-breachsim}
  BOOTSTRAP_ORG_TIMEZONE: ${BOOTSTRAP_ORG_TIMEZONE:-UTC}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-BreachSim Administrator}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  BOOTSTRAP_REVIEWER_EMAIL: ${BOOTSTRAP_REVIEWER_EMAIL:-}
  BOOTSTRAP_REVIEWER_NAME: ${BOOTSTRAP_REVIEWER_NAME:-BreachSim Reviewer}
  BOOTSTRAP_REVIEWER_PASSWORD: ${BOOTSTRAP_REVIEWER_PASSWORD:-}
  AI_PROVIDER: ${AI_PROVIDER:-rule_based}
  TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
  TOGETHER_MODEL: ${TOGETHER_MODEL:-openai/gpt-oss-20b}
  VOICE_CLONE_PROVIDER: ${VOICE_CLONE_PROVIDER:-none}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  VIDEO_CLONE_PROVIDER: ${VIDEO_CLONE_PROVIDER:-none}
  DID_API_KEY: ${DID_API_KEY:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: breachsim
      POSTGRES_USER: breachsim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breachsim -d breachsim"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]

  migrate:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["sh", "-c", "alembic upgrade head && python scripts/bootstrap_production.py"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    restart: "no"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "2",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
      ]
    volumes:
      - media_data:/data/media
      - report_data:/data/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [edge, data]

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    command: ["python", "-m", "app.workers.worker"]
    volumes:
      - media_data:/data/media
      - report_data:/data/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [data]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_DEMO_MODE: "false"
    restart: unless-stopped
    environment:
      SERVER_API_BASE_URL: http://backend:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [edge]

networks:
  edge:
  data:
    internal: true

volumes:
  postgres_data:
  redis_data:
  media_data:
  report_data:
  caddy_data:
  caddy_config:
