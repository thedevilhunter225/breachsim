[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breachsim-backend"
version = "0.1.0"
description = "BreachSim FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "azure-identity>=1.25.0",
  "azure-keyvault-secrets>=4.10.0",
  "azure-servicebus>=7.14.0",
  "azure-storage-blob>=12.27.0",
  "cryptography>=44.0.0",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "dnspython>=2.8.0",
  "google-auth>=2.40.0",
  "joserfc>=1.7.0",
  "pydantic-settings>=2.7.1",
  "pyotp>=2.9.0",
  "pyjwt>=2.10.1",
  "psycopg[binary]>=3.2.4",
  "python-multipart>=0.0.20",
  "qrcode[pil]>=8.0",
  "redis>=5.2.1",
  "requests>=2.32.0",
  "rq>=2.1.0",
  "sqlalchemy>=2.0.37",
  "uvicorn[standard]>=0.34.0"
]

[project.optional-dependencies]
dev = [
  "faker>=36.1.0",
  "pip-audit>=2.9.0",
  "pytest>=8.3.4",
  "pytest-cov>=6.0.0",
  "ruff>=0.12.0",
  "zxing-cpp>=2.3.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
